[project]
name = "d3"
version = "0.1.0"
description = "D3 - voice-controlled desktop assistant for Windows"
readme = "PLAN.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.5",
    "faster-whisper>=1.1",
    "rapidfuzz>=3.9",
    "vosk>=0.3.45",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
d3 = "d3.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
