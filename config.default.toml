# D3 default settings. Override any value in config.toml (same keys, gitignored).

[audio]
device = ""                 # input device index or name substring; "" = Windows default

[wake]
model = "hey_jarvis"        # built-in stand-in; a trained model file works too: "models/hey_d3.onnx" (see PLAN.md)
threshold = 0.5
ptt_key = "`"               # push-to-talk: hold while speaking, release to run (single key only)

[listen]
vad_threshold = 0.5
silence_ms = 600            # trailing silence that ends a command
max_ms = 6000               # hard cap on a command
no_speech_timeout_ms = 4000 # give up if nothing is said after the chime
ignore_after_chime_ms = 160 # don't let the chime itself count as speech
preroll_ms = 240            # audio kept from before VAD detects speech (VAD fires late) / before a PTT press
ptt_min_hold_ms = 250       # shorter presses are typing, not push-to-talk: ignored silently
duck_to = 0.2               # lower system volume to 20% while listening

[stt]
vosk_model = "models/vosk-model-small-en-us-0.15"
vosk_min_conf = 0.9
whisper_model = "tiny.en"
whisper_threads = 8
whisper_beam = 5

[volume]
step = 0.10

[search]
# Where "open <file>" looks. {name} = Windows known folder (follows OneDrive redirection).
roots = ['{desktop}', '{documents}', '{downloads}', '{pictures}', '{onedrive}\Pictures', 'D:\']
# Path fragments never searched (dev junk, system folders).
excludes = [
    '\node_modules\', '\.git\', '\.venv\', '\venv\', '\__pycache__\', '\target\', '\build\',
    '\dist\', '\.next\', '\.gradle\', '\.idea\', '\$RECYCLE.BIN\', '\System Volume Information\',
    '\Config.Msi\', 'D:\PROJECTS\D3\bench\', 'D:\PROJECTS\D3\recordings\',
]
ask_margin = 8          # ask "which one?" when the runner-up scores within this of the best
min_coverage = 0.6      # share of spoken words that must appear in the name

[folders.aliases]
# Spoken name = path. Built in: desktop, documents, downloads, pictures, videos, music, "<letter> drive".
projects = 'D:\PROJECTS'

[apps.aliases]
# Spoken name = Start menu name, e.g. "browser" = "Google Chrome"

[commands.aliases]
# Your own phrases for built-in commands (helps with accents), e.g.
# "shut up" = "mute"
# "keep going" = "continue"

[llm]
# Fallback for phrasing the local router can't match. Text only; audio never leaves the PC.
enabled = true
model = "claude-haiku-4-5"
daily_call_cap = 50       # stops calling (and says "I didn't catch that") after this many calls a day
timeout_s = 4.0
max_tokens = 200

[dialog]
choice_timeout_ms = 30000 # how long the "which one?" list stays on screen and "first / second / third" works

[data]
dir = "data"            # app cache and learned choices (gitignored)

[log]
dir = "logs"
# Debugging only: save each captured command as a WAV in recordings/debug/ (local, gitignored).
# Off by default - D3 normally stores no audio.
save_audio = false
